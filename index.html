<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notre Surprise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Musique de fond -->
    <audio id="background-music" loop>
        <source src="musique.mp3" type="audio/mp3">
        Votre navigateur ne supporte pas l'élément audio.
    </audio>

    <div class="main-container">

        <!-- SECTION 1 : L'enveloppe -->
        <div id="enveloppe-section" class="section">
            <div class="envelope-wrapper" onclick="ouvrirEnveloppe()">
                <div class="envelope">
                    <div class="letter" id="lettre-amour">
                        <h2>Pour Sara,</h2>
                        <p>1 univers, 8 planètes, 195 pays, 300 000 îles, 5 océans, 8 milliards d’humains, 3 milliards de femmes, et j'ai eu le privilège de te rencontrer. ❤️</p>
                    </div>
                </div>
                <div class="envelope-flap"></div>
                <div class="envelope-pocket"></div>
            </div>
            <p class="instruction-clic">TOUCHE LA LETTRE</p>
        </div>

        <!-- SECTION 2 : Les Activités (générées par JS) -->
        <div id="activite-section" class="section" style="display: none;">
            <!-- Injecté dynamiquement -->
        </div>

        <!-- SECTION 3 : La grande question -->
        <div id="question-section" class="section" style="display: none;">
            <h2 id="texte-question">Accepterais-tu de partager un moment avec moi ?</h2>
            <div id="container-image-question"></div>
            <div class="buttons-container">
                <button id="btn-oui" class="btn-choix oui" onclick="validerOui()">Oui</button>
                <button id="btn-non" class="btn-choix non" onclick="clicNon()">Non</button>
            </div>
        </div>

        <!-- SECTION 4 : Choix de la date -->
        <div id="date-section" class="section" style="display: none;">
            <h2>Quel jour ?</h2>
            <input type="date" id="date-input" class="input-date-heure">
            <button class="btn-suivant" onclick="validerDate()">Suivant -></button>
        </div>

        <!-- SECTION 5 : Choix de l'heure -->
        <div id="heure-section" class="section" style="display: none;">
            <h2>À quelle heure ?</h2>
            <input type="time" id="heure-input" class="input-date-heure">
            <button class="btn-suivant" onclick="validerHeure()">C'est parti !</button>
        </div>

        <!-- SECTION 6 : Validation finale -->
        <div id="validation-section" class="section" style="display: none;">
            <h2>C'est validé ! 🎉</h2>
            <div id="container-image-validation"></div>
            <div class="grille-fin" id="grille-fin">
                <!-- Tes petites photos souvenirs ou icônes de fin si tu veux -->
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
